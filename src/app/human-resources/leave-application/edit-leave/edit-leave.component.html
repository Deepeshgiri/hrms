<form #leaveForm="ngForm" (ngSubmit)="updateLeave(leaveForm.value)">
    <ckeditor [editor]="Editor" name="leaveContent" [(ngModel)]="leave.leaveContent" required></ckeditor>
    <div style="height:10px"></div>
    <div class="row">
        <div class="col-sm-3">
            <mat-form-field>
                <input name="fromDate" [(ngModel)]="fromDate" matInput [owlDateTime]="dt1" [owlDateTimeTrigger]="dt1"
                    placeholder="From Date" required>
                <span matSuffix class="material-icons">calendar_today</span>
                <owl-date-time #dt1 [pickerType]="'calendar'"></owl-date-time>
            </mat-form-field>
        </div>
        <div class="col-sm-3">
            <mat-form-field>
                <input name="toDate" [(ngModel)]="toDate" matInput [owlDateTime]="dt2" [owlDateTimeTrigger]="dt2"
                    placeholder="To Date" required>
                <span matSuffix class="material-icons">calendar_today</span>
                <owl-date-time #dt2 [pickerType]="'calendar'"></owl-date-time>
            </mat-form-field>
        </div>
        <div class="col-sm-3">
            <mat-form-field>
                <mat-label>Reason</mat-label>
                <input name="reason" [(ngModel)]="leave.reason" matInput placeholder="Like Marriage Event etc." required>
            </mat-form-field>
        </div>
        <div class="col-sm-3">
            <button type="submit" mat-raised-button color="primary" [disabled]="leaveForm.invalid">Submit</button>
        </div>
    </div>
</form>
