<div class="users-leaves-container">
  <h2>Users Leaves</h2>
  
  <div class="controls">
    <button (click)="changeDate('prev')">← Previous</button>
    <span>{{ date | date: 'MMMM yyyy' }}</span>
    <button (click)="changeDate('next')">Next →</button>
  </div>

  <app-loading [show]="loading"></app-loading>

  <div *ngIf="!loading && usersLeaves.length > 0" class="leaves-table">
    <table>
      <thead>
        <tr>
          <th>User</th>
          <th>Leave Type</th>
          <th>From Date</th>
          <th>To Date</th>
          <th>Status</th>
          <th>Days</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let leave of usersLeaves">
          <td>{{ leave.userName }}</td>
          <td>{{ leave.leaveType }}</td>
          <td>{{ leave.fromDate | date: 'dd/MM/yyyy' }}</td>
          <td>{{ leave.toDate | date: 'dd/MM/yyyy' }}</td>
          <td>{{ leave.status }}</td>
          <td>{{ leave.days }}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="!loading && usersLeaves.length === 0" class="no-data">
    <p>No leaves found for this month</p>
  </div>
</div>
