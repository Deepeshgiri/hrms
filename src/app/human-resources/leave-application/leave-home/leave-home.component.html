<admin-header></admin-header>
<admin-sidebar></admin-sidebar>
<div id="page-content">
    <div class="leave-row">
       
        <button mat-raised-button (click)="applyLeave()"> <mat-icon>add</mat-icon>Apply Leave</button>
    </div>
    <ng-container *ngIf="leaves && leaves.length">
        <div class="content-title">Recent Leaves <div id="leavesMessage" *ngIf="leavesInfo"> 
            <span [innerText]="leavesInfo.remainingLeaves"></span> Leaves Remaining </div></div>
        <table class="pinnacle-table big-heading">
            <tr>
                <th>Leave</th>
                <th>From</th>
                <th>To</th>
                <th>Reason</th>
                <th>Date</th>
                <th>Response</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
            <ng-container *ngFor="let leave of leaves">
                <tr>
                    <td [innerHTML]="leave.leaveContent | safe"></td>
                    <td>{{leave.fromDate}}</td>
                    <td>{{leave.toDate}}</td>
                    <td>{{leave.reason}}</td>
                    <td>{{leave.timestamp}}</td>
                    <td>{{leave.response}}</td>
                    <td>{{leave.status}}</td>
                    <td>
                        <ng-container *ngIf="leave.status=='Pending'">
                            <button mat-mini-fab color="primary" (click)="editLeave(leave)">
                                <mat-icon>create</mat-icon>
                            </button>&nbsp;&nbsp;
                            <button mat-mini-fab color="warn" (click)="deleteLeave(leave)">
                                <mat-icon>delete</mat-icon>
                            </button>
                        </ng-container>
                    </td>
                </tr>
            </ng-container>
        </table>
    </ng-container>
    <div class="no-data perfect-centered" *ngIf="leaves && !leaves.length">No leaves requested</div>
</div>
<loading [show]="loading"></loading>

<!--Edit Leave  -->
<div class="modal" modal [show]="modals.editLeave" [options]="{width:'900px'}">
    <div class="dialog">
        <div class="modal-header">Edit Leave</div>
        <div class='close' (click)="modals.editLeave=false">&times;</div>
        <div class="modal-body">
            <edit-leave *ngIf="modals.editLeave" [leave]="activeLeave" [modal]="modals" ></edit-leave>
        </div>

    </div>
</div>

<!-- Request Leave -->
<div class="modal" modal [show]="modals.requestLeave" [options]="{width:'900px'}">
    <div class="dialog">
        <div class="modal-header">Request Leave</div>
        <div class='close' (click)="modals.requestLeave=false">&times;</div>
        <div class="modal-body">
            <app-request-leave *ngIf="modals.requestLeave" [isModal]="true"></app-request-leave>
        </div>

    </div>
</div>
