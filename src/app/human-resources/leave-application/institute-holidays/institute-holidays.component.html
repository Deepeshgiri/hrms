<div class="content-title">
  Institute Holidays
  <button mat-raised-button color="primary" (click)="openAddForm()">
    <mat-icon>add</mat-icon> Add Holiday
  </button>
</div>

<!-- Add / Edit Form -->
<mat-card class="content-box" *ngIf="showForm">
  <mat-card-header>
    <mat-card-title>{{ editingDate ? 'Edit Holiday' : 'Add New Holiday' }}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div class="form-row">

      <mat-form-field appearance="outline" *ngIf="!editingDate">
        <mat-label>Date</mat-label>
        <input [(ngModel)]="form.date" matInput [matDatepicker]="picker" placeholder="Select date" required>
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>

      <mat-form-field appearance="outline" *ngIf="editingDate">
        <mat-label>Date</mat-label>
        <input matInput [value]="editingDate" disabled>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Title *</mat-label>
        <input matInput [(ngModel)]="form.title" placeholder="e.g. Republic Day" required>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Type</mat-label>
        <mat-select [(ngModel)]="form.type">
          <mat-option *ngFor="let t of holidayTypes" [value]="t">{{ t }}</mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Description</mat-label>
      <textarea matInput [(ngModel)]="form.description" rows="3"
        placeholder="Optional details about this holiday"></textarea>
    </mat-form-field>
  </mat-card-content>
  <mat-card-actions>
    <button mat-raised-button color="primary" (click)="submit()" [disabled]="loading || !form.title.trim()">
      {{ loading ? 'Saving...' : (editingDate ? 'Update' : 'Add Holiday') }}
    </button>
    <button mat-stroked-button (click)="cancelForm()" [disabled]="loading">Cancel</button>
  </mat-card-actions>
</mat-card>

<!-- Holidays Table -->
<div class="table-wrapper" *ngIf="holidays && holidays.length; else noHolidays">
  <table class="pinnacle-table big-heading">
    <thead>
      <tr>
        <th>Date</th>
        <th>Title</th>
        <th>Type</th>
        <th>Description</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let h of holidays; let i = index">
        <td><strong>{{ h.leaveDate | date:'mediumDate' }}</strong></td>
        <td>{{ h.title }}</td>
        <td>
          <span class="status-badge" [ngClass]="h.type.toLowerCase()">{{ h.type }}</span>
        </td>
        <td>{{ h.description || '—' }}</td>
        <td>
          <button mat-icon-button color="primary" (click)="openEditForm(h)" matTooltip="Edit">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deleteHoliday(h, i)" matTooltip="Delete">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<ng-template #noHolidays>
  <div class="no-data">No holidays configured yet.</div>
</ng-template>

<loading [show]="loading"></loading>
