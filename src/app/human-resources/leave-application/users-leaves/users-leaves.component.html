<admin-header></admin-header>
<admin-sidebar></admin-sidebar>
<div id="page-content">
    <!-- <div class="row leave-row">
        <button mat-raised-button> <mat-icon>add</mat-icon> Leave</button>
    </div> -->
    <ng-container *ngIf="leaves && leaves.length">
        <div class="content-title">Users Leaves</div>
        <div class="table-wrapper">
        <table class="pinnacle-table big-heading">
            <tr>
                <th>Name</th>
                <th>Leave</th>
                <th>From</th>
                <th>To</th>
                <th>Reason</th>
                <th>Date</th>
                <th>Response</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
            <ng-container *ngFor="let leave of leaves">
                <tr>
                    <td>{{leave.name}}</td>
                    <td>
                        <button (click)="showLeaveContent(leave.leaveContent)" mat-mini-fab>
                            <mat-icon>visibility</mat-icon>
                        </button>
                    </td>
                    <td>{{leave.fromDate}}</td>
                    <td>{{leave.toDate}}</td>
                    <td>{{leave.reason}}</td>
                    <td>{{leave.timestamp}}</td>
                    <td>{{leave.response}}</td>
                    <td>{{leave.status}}</td>
                    <td>
                        <!-- <ng-container *ngIf="leave.status!='Accepted'">
                            <button mat-mini-fab color="primary" (click)="acceptRejectLeave(leave,2)">
                                <mat-icon>done</mat-icon>
                            </button>&nbsp;
                        </ng-container>
                        <ng-container *ngIf="leave.status!='Rejected'">
                            <button mat-mini-fab color="warn" (click)="acceptRejectLeave(leave,3)">
                                <mat-icon>close</mat-icon>
                            </button>
                        </ng-container> -->
                        <button mat-raised-button (click)="modals.responseModal=true;activeLeave=leave">Action</button>
                    </td>
                </tr>
            </ng-container>
        </table>
        </div>

    </ng-container>
    <div class="no-data perfect-centered" *ngIf="leaves &&  !leaves.length">No leaves requested</div>
</div>

<!--Leave Response Modal-->
<div class="modal" modal [show]="modals.responseModal" [options]="{width:'500px'}">
    <div class="dialog">
        <div class="modal-header">Response</div>
        <div class='close' (click)="modals.responseModal=false">&times;</div>
        <div class="modal-body">
            <mat-form-field>
                <mat-label>Response</mat-label>
                <textarea [(ngModel)]="response" #res="ngModel" matInput required></textarea>
            </mat-form-field>
            <button style="margin-right: 10px;" *ngIf="activeLeave && activeLeave.status!='Accepted'" mat-raised-button
                color="primary" [disabled]="res.invalid" (click)="acceptRejectLeave(2,activeLeave.userId)">Accept</button>
            <button *ngIf="activeLeave && activeLeave.status!='Rejected'" mat-raised-button color="warn"
                [disabled]="res.invalid" (click)="acceptRejectLeave(3,activeLeave.userId)">Reject</button>
        </div>
    </div>
</div>

<loading [show]="loading"></loading>
