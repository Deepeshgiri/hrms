<admin-header></admin-header>
<admin-sidebar></admin-sidebar>

<div id="page-content">

  <!-- TITLE -->
  <div class="content-title">Set Timings</div>

  <!-- FORM -->
  <div class="content-box">
    <form #timingsForm="ngForm">

      <div class="row">

        <!-- USER -->
        <div class="col-sm-12">
          <mat-form-field appearance="outline" style="width: 100%;">
            <mat-label>Select User</mat-label>
            <mat-select
              name="userId"
              [(ngModel)]="timingForm.userId"
              (selectionChange)="populateTimings()"
              required>

              <mat-option *ngFor="let user of users" [value]="user.userId">
                {{ user.name }}
              </mat-option>

            </mat-select>
          </mat-form-field>
        </div>

        <!-- FROM -->
        <div class="col-sm-6">
          <mat-form-field appearance="outline" style="width: 100%;">
            <mat-label>From Time</mat-label>
            <mat-select name="fromTime" [(ngModel)]="timingForm.fromTime">
              <mat-option *ngFor="let ts of timeSlots" [value]="ts">
                {{ ts }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>

        <!-- TO -->
        <div class="col-sm-6">
          <mat-form-field appearance="outline" style="width: 100%;">
            <mat-label>To Time</mat-label>
            <mat-select name="toTime" [(ngModel)]="timingForm.toTime">
              <mat-option *ngFor="let ts of timeSlots" [value]="ts">
                {{ ts }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>

      </div>

      <!-- SUBMIT -->
      <button mat-raised-button color="primary" (click)="submitTimings()">
        Submit
      </button>

    </form>
  </div>

  <div style="height: 20px;"></div>

  <!-- ACTIVE TIMINGS -->
  <div class="content-title">Active Timings</div>

  <div class="table-container">

    <table class="pinnacle-table">

      <thead>
        <tr>
          <th>Name</th>
          <th>From</th>
          <th>To</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let t of timings">
          <td>{{ t.name }}</td>
          <td>{{ t.fromTime }}</td>
          <td>{{ t.toTime }}</td>
        </tr>
      </tbody>

    </table>

  </div>

</div>

<!-- LOADING -->
<loading [show]="loading"></loading>
